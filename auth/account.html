<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account Settings — Knowledge Base — Complete Windows & Doors</title>
<link rel="icon" type="image/png" href="../cwd%20logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
</head>
<body>
<div class="auth-shell">

  <div class="auth-header">
    <img src="../cwd logo.png" alt="Complete Windows & Doors">
    <span class="eyebrow">Complete Windows &amp; Doors</span>
    <h1>Account Settings</h1>
  </div>

  <div class="auth-card">

    <div class="message" id="accountMessage"></div>

    <div class="signed-in-as" id="signedInAs"></div>

    <div class="auth-tabs">
      <button type="button" class="auth-tab" data-tab="profile">Your Profile</button>
      <button type="button" class="auth-tab" data-tab="settings">Settings</button>
    </div>

    <div class="auth-panel" id="panel-profile">

      <div class="account-section">
        <h2 class="section-title">Profile Photo</h2>
        <div class="avatar-row">
          <div class="avatar-preview" id="avatarPreview"></div>
          <div class="avatar-controls">
            <label class="btn btn-secondary avatar-upload-btn" for="avatarInput" id="avatarUploadLabel">Upload Photo</label>
            <input type="file" id="avatarInput" accept="image/png,image/jpeg,image/webp" hidden>
            <span class="form-hint">JPG, PNG, or WEBP — up to 2MB. Resized automatically.</span>
          </div>
        </div>
      </div>

      <div class="account-section">
        <h2 class="section-title">Your Name</h2>
        <form id="nameForm">
          <div class="form-group">
            <label class="form-label" for="displayName">What should we call you?</label>
            <input class="form-input" type="text" id="displayName" required>
          </div>
          <button type="submit" class="btn btn-primary" id="nameSubmit">Save Name</button>
        </form>
      </div>

    </div>

    <div class="auth-panel" id="panel-settings">

      <div class="account-section">
        <h2 class="section-title">Date &amp; Time</h2>
        <div class="form-group">
          <label class="form-label" for="timezoneMode">Show timestamps in</label>
          <select class="form-input" id="timezoneMode">
            <option value="eastern">Eastern Time (default)</option>
            <option value="local">My Device's Local Time</option>
          </select>
        </div>
      </div>

      <div class="account-section">
        <h2 class="section-title">Change Password</h2>
        <form id="passwordForm">
          <div class="form-group">
            <label class="form-label" for="newPassword">New Password</label>
            <input class="form-input" type="password" id="newPassword" autocomplete="new-password" required minlength="8" placeholder="At least 8 characters">
          </div>
          <div class="form-group">
            <label class="form-label" for="newPasswordConfirm">Confirm New Password</label>
            <input class="form-input" type="password" id="newPasswordConfirm" autocomplete="new-password" required minlength="8" placeholder="Re-type new password">
          </div>
          <button type="submit" class="btn btn-primary" id="passwordSubmit">Update Password</button>
        </form>
      </div>

      <div class="account-section" id="adminSection" style="display:none;">
        <h2 class="section-title">Admin</h2>
        <a href="admin.html" class="btn btn-secondary" style="display:block; text-align:center; text-decoration:none; box-sizing:border-box;">Manage Users</a>
      </div>

      <div class="account-section">
        <button type="button" class="btn btn-secondary" id="signOutBtn">Sign Out</button>
      </div>

    </div>

  </div>

  <a href="../index.html" class="back-home">&larr; Back to Knowledge Base</a>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="../timezone.js"></script>
<script src="account.js"></script>
</body>
</html>
