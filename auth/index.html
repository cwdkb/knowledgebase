<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — Knowledge Base — Complete Windows & Doors</title>
<link rel="icon" type="image/png" href="../cwd%20logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
</head>
<body>
<div class="auth-shell">

  <div class="auth-header">
    <img src="../cwd logo.png" alt="Complete Windows & Doors">
    <span class="eyebrow">Complete Windows &amp; Doors</span>
    <h1>Knowledge Base</h1>
    <span class="subline">Sign in with your completewd.com email</span>
  </div>

  <div class="auth-card">

    <div class="auth-tabs">
      <button type="button" class="auth-tab active" data-tab="login">Log In</button>
      <button type="button" class="auth-tab" data-tab="signup">Sign Up</button>
    </div>

    <div class="message" id="authMessage"></div>

    <!-- Log In -->
    <div class="auth-panel active" id="panel-login">
      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="loginEmail">Work Email</label>
          <input class="form-input" type="email" id="loginEmail" autocomplete="username" required placeholder="you@completewd.com">
        </div>
        <div class="form-group">
          <label class="form-label" for="loginPassword">Password</label>
          <input class="form-input" type="password" id="loginPassword" autocomplete="current-password" required placeholder="••••••••">
        </div>
        <div class="form-group checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" id="rememberMe" checked>
            Remember me on this device
          </label>
        </div>
        <button type="submit" class="btn btn-primary" id="loginSubmit">Log In</button>
      </form>
      <div class="auth-links">
        <button type="button" class="link-btn" id="forgotPasswordBtn">Forgot your password?</button>
      </div>
    </div>

    <!-- Sign Up -->
    <div class="auth-panel" id="panel-signup">
      <form id="signupForm">
        <div class="form-group">
          <label class="form-label" for="signupName">Your Name</label>
          <input class="form-input" type="text" id="signupName" autocomplete="name" required placeholder="What should we call you?">
        </div>
        <div class="form-group">
          <label class="form-label" for="signupEmail">Work Email</label>
          <input class="form-input" type="email" id="signupEmail" autocomplete="username" required placeholder="you@completewd.com">
          <div class="form-hint">Must be a @completewd.com address.</div>
        </div>
        <div class="form-group">
          <label class="form-label" for="signupPassword">Password</label>
          <input class="form-input" type="password" id="signupPassword" autocomplete="new-password" required minlength="8" placeholder="At least 8 characters">
        </div>
        <div class="form-group">
          <label class="form-label" for="signupPasswordConfirm">Confirm Password</label>
          <input class="form-input" type="password" id="signupPasswordConfirm" autocomplete="new-password" required minlength="8" placeholder="Re-type your password">
        </div>
        <button type="submit" class="btn btn-primary" id="signupSubmit">Create Account</button>
      </form>
    </div>

  </div>

  <a href="../index.html" class="back-home">&larr; Back to Knowledge Base</a>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="login.js"></script>
</body>
</html>
