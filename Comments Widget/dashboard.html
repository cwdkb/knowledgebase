<!DOCTYPE html>
<html lang="en">
<head>
<script>document.documentElement.style.visibility='hidden';</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comments &amp; Revisions — Knowledge Base — Complete Windows &amp; Doors</title>
<link rel="icon" type="image/png" href="../cwd%20logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dashboard.css">
</head>
<body data-kb-depth="1">

<div class="topbar">
  <a class="back-link" href="../auth/account.html" title="Back to your account">&larr;</a>
  <a class="brand" href="../index.html" title="Back to Knowledge Base">
    <span class="brand-mark"><img src="../cwd logo.png" alt=""></span>
    <span class="brand-titles">
      <span class="brand-eyebrow">Knowledge Base</span>
      <span class="brand-h1">Comments &amp; Revisions</span>
    </span>
  </a>
  <div class="topsearch">
    <input type="text" id="searchInput" placeholder="Search comments…">
  </div>
  <div class="topbar-spacer"></div>
  <button class="new-btn" id="newBtn">+ New Comment</button>
</div>

<div class="dash-message" id="dashMessage"></div>

<div class="main">
  <div class="pane rail" id="rail"></div>
  <div class="resize-handle" id="handleRailList" title="Drag to resize"></div>
  <div class="pane list-pane" id="listPane">
    <div class="list-head">
      <span class="list-count" id="listCount">Loading…</span>
      <button class="list-sort" id="sortBtn">Newest first</button>
    </div>
    <div class="rows" id="rows"></div>
  </div>
  <div class="resize-handle" id="handleListDetail" title="Drag to resize"></div>
  <div class="pane detail-pane" id="detailPane"></div>
</div>

<div class="compose hidden" id="compose">
  <div class="compose-head" id="composeHead">
    <span>New Comment</span>
    <div class="compose-head-btns">
      <button type="button" id="composeMin" title="Minimize">&#8211;</button>
      <button type="button" id="composeClose" title="Close">&times;</button>
    </div>
  </div>
  <div class="compose-body">
    <select id="composePage" required></select>
    <textarea id="composeText" placeholder="Leave a note or revision request…"></textarea>
  </div>
  <div class="form-error hidden" id="composeError" style="margin: -6px 14px 8px;"></div>
  <div class="compose-footer">
    <button type="button" class="compose-submit" id="composeSubmit">Post</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../auth-guard.js"></script>
<script src="../timezone.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
